<p class="touch-selection-help" id="touch-selection-help">
  Gedrückt halten startet die Mehrfachauswahl. Weitere Blöcke lassen sich dann antippen.
</p>
<div
  class="song-lines"
  aria-label="Bearbeitbare Liedblöcke"
  aria-describedby="touch-selection-help"
>
  @for (line of lines().controls; track $index; let lineIndex = $index) {
    <section class="song-line" [attr.aria-label]="'Zeile ' + (lineIndex + 1)">
      <div class="line-heading">
        <span class="line-number">{{ lineIndex + 1 }}</span>
        <div class="line-actions" [attr.aria-label]="'Aktionen für Zeile ' + (lineIndex + 1)">
          <button
            type="button"
            [attr.data-testid]="'line-add-' + lineIndex"
            (click)="structureAction.emit({ kind: 'insert-line', lineIndex })"
          >
            Zeile danach
          </button>
          <button
            type="button"
            [attr.data-testid]="'line-duplicate-' + lineIndex"
            (click)="structureAction.emit({ kind: 'duplicate-line', lineIndex })"
          >
            Duplizieren
          </button>
          <button
            type="button"
            [attr.data-testid]="'line-delete-' + lineIndex"
            [disabled]="lines().length === 1"
            (click)="structureAction.emit({ kind: 'delete-line', lineIndex })"
          >
            Löschen
          </button>
        </div>
      </div>
      <div class="words">
        @for (word of line.controls.words.controls; track $index; let wordIndex = $index) {
          <button
            class="word-card"
            type="button"
            [class.is-selected]="isSelected(lineIndex, wordIndex)"
            [class.is-active]="isActive(lineIndex, wordIndex)"
            [attr.data-testid]="'word-card-' + lineIndex + '-' + wordIndex"
            [attr.aria-pressed]="isSelected(lineIndex, wordIndex)"
            [attr.aria-label]="
              wordLabel(word) +
              ', Zeile ' +
              (lineIndex + 1) +
              ', Block ' +
              (wordIndex + 1) +
              ', bearbeiten'
            "
            (pointerdown)="startLongPress($event, lineIndex, wordIndex)"
            (pointermove)="trackLongPress($event)"
            (pointerup)="finishLongPress($event)"
            (pointercancel)="finishLongPress($event)"
            (contextmenu)="preventTouchContextMenu($event)"
            (click)="selectWord($event, lineIndex, wordIndex)"
            (keydown)="handleWordKeydown($event, lineIndex, wordIndex)"
          >
            <span class="event-preview" aria-hidden="true">
              @for (event of wordEvents(word); track $index) {
                <span [class.is-chord]="event.kind === 'chord'">
                  {{ eventLabel(event) }}
                </span>
              } @empty {
                <span class="empty-event">+</span>
              }
            </span>
            <strong>{{ wordLabel(word) }}</strong>
          </button>
        }
      </div>
    </section>
  }
</div>
